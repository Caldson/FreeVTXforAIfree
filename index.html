<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitual XRing 官方福利</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px 48px;
    background:
      radial-gradient(900px 500px at 50% -10%, #2a2f6b 0%, transparent 60%),
      #0b0e1a;
    color: #e9ecff;
    font: 15px/1.65 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { width: 100%; max-width: 560px; margin: 0 auto; }

  .brand {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 5px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #6c7bff, #a855f7);
    font-weight: 800; font-size: 16px; color: #fff;
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  .tag {
    display: block; width: fit-content; margin: 0 auto 22px;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(108, 123, 255, .16);
    border: 1px solid rgba(108, 123, 255, .35);
    color: #aab4ff; font-size: 12px;
  }

  .card {
    padding: 22px;
    border: 1px solid #242a46;
    border-radius: 16px;
    background: rgba(23, 27, 46, .92);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  .card + .card { margin-top: 16px; }

  .offer {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 6px 0 18px;
  }
  .price {
    padding: 8px 16px; border-radius: 12px;
    background: #10142a; border: 1px solid #2b3255;
    font: 700 18px/1 ui-monospace, Consolas, monospace; color: #cfd6ff;
  }
  .price small { display: block; margin-top: 4px; font: 400 11px/1 system-ui; color: #7f88ad; }
  .arrow { color: #6c7bff; font-size: 20px; }
  .price.bonus {
    background: linear-gradient(135deg, rgba(108,123,255,.22), rgba(168,85,247,.22));
    border-color: rgba(168, 85, 247, .5); color: #fff;
  }
  .price.bonus small { color: #b9a6ff; }

  ol { margin: 0; padding-left: 20px; color: #b9c0dd; font-size: 14px; }
  ol li { margin: 6px 0; }
  ol b { color: #e9ecff; }

  .primary {
    width: 100%; margin-top: 6px; padding: 13px;
    border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #6c7bff, #8b5cf6);
    color: #fff; font: inherit; font-weight: 700;
    transition: filter .15s, transform .05s;
  }
  .primary:hover:not(:disabled) { filter: brightness(1.1); }
  .primary:active:not(:disabled) { transform: translateY(1px); }
  .primary:disabled { opacity: .55; cursor: not-allowed; }

  .hint { margin: 12px 0 0; color: #767fa6; font-size: 12px; text-align: center; }

  iframe {
    width: 100%; height: 660px; margin-top: 16px;
    border: 1px solid #242a46; border-radius: 12px;
    background: #0b0e1a;
  }

  .status {
    margin-top: 16px; padding: 14px 16px;
    border: 1px solid #242a46; border-radius: 12px;
    background: #10142a; font-size: 14px;
  }
  .status.ok { border-color: rgba(74, 222, 128, .4); background: rgba(74, 222, 128, .07); }
  .status.err { border-color: rgba(255, 107, 107, .4); background: rgba(255, 107, 107, .07); }
  .status h3 { margin: 0 0 8px; font-size: 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; color: #aeb6d8; }
  .row span:last-child { color: #e9ecff; font-variant-numeric: tabular-nums; }
  pre {
    margin: 10px 0 0; padding: 10px; max-height: 200px; overflow: auto;
    border-radius: 8px; background: #0b0e1a;
    font: 11px/1.5 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all; color: #9aa4cc;
  }
  footer { margin-top: 22px; text-align: center; color: #5d6588; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="logo">V</div>
    <h1>Vitual XRing</h1>
  </div>
  <span class="tag">官方福利活动</span>

  <section class="card">
    <div class="offer">
      <div class="price">5.00 VTX<small>参与费用</small></div>
      <div class="arrow">→</div>
      <div class="price bonus">1000.00 VTX<small>立即到账</small></div>
    </div>

    <ol>
      <li>点击下方按钮，打开官方支付页</li>
      <li>登录你的 VTX 账户（未登录会自动显示登录框）</li>
      <li>支付 <b>5.00 VTX</b>，奖励由服务端直接入账</li>
    </ol>

    <button id="start" class="primary" type="button">参与活动</button>
    <p class="hint">每个账户限参与一次 · 支付金额与收款方已锁定</p>

    <iframe id="pay-frame" hidden referrerpolicy="no-referrer" title="VTX 支付"></iframe>

    <div id="status" class="status" hidden></div>
  </section>

  <footer>本活动由 Vitual XRing 官方发起 · xsmmc.caldson.us.ci</footer>
</div>

<script>
const CONFIG = {
  apiOrigin: "https://xsmmc.caldson.us.ci",
  // 活动收款账户的登录名，必须与 Worker 里的 CAMPAIGN_ACCOUNT 一致
  campaignAccount: "Kitawaga",
  payAmount: "5.00",
  bonusAmount: "1000.00",
  description: "Vitual XRing 官方福利",
};

const startButton = document.getElementById("start");
const frame = document.getElementById("pay-frame");
const statusBox = document.getElementById("status");

function buildPayUrl() {
  const params = new URLSearchParams({
    type: "payment",
    party: CONFIG.campaignAccount,
    amount: CONFIG.payAmount,
    description: CONFIG.description,
    lock: "1",
  });
  return `${CONFIG.apiOrigin}/API_VTXPAY.html?${params.toString()}`;
}

function renderStatus(ok, title, rows, raw) {
  statusBox.className = ok ? "status ok" : "status err";
  statusBox.hidden = false;
  statusBox.innerHTML = "";

  const heading = document.createElement("h3");
  heading.textContent = title;
  statusBox.appendChild(heading);

  for (const [label, value] of rows) {
    const row = document.createElement("div");
    row.className = "row";
    const key = document.createElement("span");
    key.textContent = label;
    const val = document.createElement("span");
    val.textContent = value ?? "—";
    row.append(key, val);
    statusBox.appendChild(row);
  }

  if (raw) {
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(raw, null, 2);
    statusBox.appendChild(pre);
  }
}

startButton.addEventListener("click", () => {
  startButton.disabled = true;
  startButton.textContent = "请在下方完成支付";
  frame.hidden = false;
  frame.src = buildPayUrl();
  frame.scrollIntoView({ behavior: "smooth", block: "center" });
});

window.addEventListener("message", (event) => {
  // 必须校验来源，否则任何页面都能伪造一条"支付成功"
  if (event.origin !== CONFIG.apiOrigin) return;

  const data = event.data;
  if (!data || data.type !== "vtx-pay" || !data.ok) return;
  if (data.kind !== "payment") return;   // 只认付款，不认收款

  const trade = data.trade || {};
  const account = data.account || {};
  const amount = Number(trade.price ?? trade.amount ?? 0);

  // 防篡改：金额必须是活动价，否则不认定参与成功
  if (Number.isFinite(amount) && amount > 0 && amount !== Number(CONFIG.payAmount)) {
    renderStatus(false, "金额与活动不符", [
      ["实付", amount + " VTX"],
      ["活动价", CONFIG.payAmount + " VTX"],
    ], data);
    startButton.disabled = false;
    startButton.textContent = "重新参与";
    return;
  }

  renderStatus(true, "支付成功，奖励已入账", [
    ["支付", CONFIG.payAmount + " VTX"],
    ["奖励", CONFIG.bonusAmount + " VTX"],
    ["当前余额", account.money ? account.money + " VTX" : "请刷新查看"],
    ["交易号", trade.id || trade.time || "—"],
  ], data);

  startButton.textContent = "已完成";
});
</script>
</body>
</html>
